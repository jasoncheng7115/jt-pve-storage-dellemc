name: Release

# Publishes a downloadable .deb whenever a version tag is pushed, so an
# operator does not have to clone the repository and build one.
#
#   git tag -a v0.7.1 -m 'Release 0.7.1'
#   git push origin v0.7.1
#
# Versioning: the patch number increments per release and runs to .99 before
# the minor number moves, so 0.7.0, 0.7.1, ... 0.7.99, then 0.8.0.
#
# The tag drives the release; debian/changelog drives the package version.
# The two are checked against each other below, because a release whose file
# name disagrees with its contents is worse than no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish .deb
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The Perl modules are the plugin's own runtime dependencies. They
          # are installed here so the unit tests actually run: without them
          # every test that loads an API client dies at compile time instead
          # of testing anything, and a green run would mean nothing.
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot \
            libwww-perl libjson-perl liburi-perl

      # One step per check, deliberately. The step list of a job is readable
      # through the public API while the logs are not, so a split like this
      # is the difference between "Run checks failed" and knowing which one.
      # That mattered: this job failed at a combined "Run checks" for twenty
      # releases, publishing nothing, and the reason was not visible from
      # outside.
      - name: Environment
        run: |
          perl -v | head -2
          for m in LWP::UserAgent JSON URI HTTP::Response Test::More; do
            printf '%-18s ' "$m"
            perl -M$m -e "print \$${m}::VERSION // 'loaded', qq{\n}" 2>&1 | tail -1
          done

      - name: Check for node-wide multipath operations
        run: make check-multipath-flush

      # The output is echoed as an annotation as well as to the log, because
      # a job's annotations are readable through the public API and its logs
      # are not. Without this, a syntax failure here is a red step with no
      # visible reason to anyone who cannot sign in.
      - name: Perl syntax
        run: |
          if ! out=$(make syntax 2>&1); then
            echo "$out"
            echo "::error title=make syntax failed::$(echo "$out" | tail -12 | tr '\n' '~')"
            exit 1
          fi
          echo "$out"

      - name: Unit tests
        run: make unit

      - name: Read the package version
        id: version
        run: |
          version=$(dpkg-parsechangelog --show-field Version)
          echo "deb=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Check the tag against debian/changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          deb="${{ steps.version.outputs.deb }}"
          # The tag uses '-beta1' where a Debian version uses '~beta1'.
          normalised="${deb//\~/-}"
          normalised="${normalised%-1}"
          if [ "$tag" != "$normalised" ]; then
            echo "Tag '$tag' does not match debian/changelog version '$deb'."
            echo "Update debian/changelog or retag before releasing."
            exit 1
          fi

      - name: Build the Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artefacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cd artifacts

          # GitHub will not serve an asset whose name contains '~': it
          # rewrites it to '.'. Renaming here rather than letting GitHub do it
          # keeps SHA256SUMS honest — hashing the Debian name and serving the
          # rewritten one makes `sha256sum -c` fail on a file it cannot find,
          # which is what a person following the install instructions would
          # hit. The name is cosmetic; apt reads the control file, not it.
          for f in ../../jt-pve-storage-dellemc_*_all.deb; do
            cp "$f" "$(basename "$f" | tr '~' '.')"
          done

          # A second copy under a name that never changes, so the install
          # instructions can carry one URL that is right forever:
          #
          #   .../releases/latest/download/jt-pve-storage-dellemc_all.deb
          #
          # GitHub resolves 'latest' but not the file name, and every real
          # file name has the version in it — so without this, every document
          # naming a download URL goes stale the moment a release is cut, and
          # somebody follows it to an old build. The name is cosmetic: apt and
          # dpkg read the version out of the control file, not the file name.
          cp jt-pve-storage-dellemc_*.beta*_all.deb jt-pve-storage-dellemc_all.deb \
            2>/dev/null || cp jt-pve-storage-dellemc_*_all.deb jt-pve-storage-dellemc_all.deb

          sha256sum *.deb > SHA256SUMS
          ls -la

          # The release page tells people to verify against this file, so a
          # release without it is a release whose instructions do not work.
          # Releases up to 0.7.52 were published without it even though it was
          # listed for upload, and nothing failed — so this checks rather than
          # assumes.
          test -s SHA256SUMS
          echo "SHA256SUMS contents:"
          cat SHA256SUMS

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: jt-pve-storage-dellemc-deb
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
          # NOT marked prerelease, and deliberately so. GitHub refuses to
          # call a prerelease "Latest", so marking every 0.x one left the
          # green badge on whatever old release happened not to be marked —
          # for a while that was v0.7.49, three weeks and twenty releases
          # behind, and that is what a first visitor saw as current. A stale
          # version presented as the newest is a worse signal than a missing
          # badge.
          #
          # The warning is not lost: the body below opens with it, the README
          # opens with it, and the version itself says beta. What this buys is
          # that the newest build is the one people find.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            ## ⚠️ Beta software — read before installing

            **Two arrays have run this plugin.** A PowerVault ME4024
            (firmware `GT280R011-01`) over Fibre Channel passes the whole of
            the first-run test, and as of 0.7.66 the lifecycle items beyond
            it — a guest OS booting off an array volume, growing a disk,
            `vzdump --mode snapshot` with a restore, an LXC container, and a
            node reboot. A PowerStore creates, maps and snapshots volumes and
            runs guests off them, though snapshot deletion, rollback and
            migration between nodes have not been exercised there.

            **PowerFlex and Unity have never been connected to anything.** On
            PowerVault the iSCSI path, live migration and a path failure are
            unrun, since that array is on FC and one node. SAS is not
            implemented at all.

            Read [what has and has not been verified](https://github.com/jasoncheng7115/jt-pve-storage-dellemc/blob/main/docs/TESTING.md)
            before trusting any of it: that page names each item and says
            which it is.

            A storage plugin runs as root, creates and deletes volumes on the
            array, and manipulates block devices on every node. A defect can
            destroy virtual machine data, take a storage offline, or leave a
            node in a state that only a reboot clears. Use a non-production
            cluster and a non-production array, and keep independent backups.

            See the [disclaimer](https://github.com/jasoncheng7115/jt-pve-storage-dellemc#disclaimer-and-risk).

            ## Install

            > Every 0.x release is a prerelease in the sense that matters:
            > 1.0.0 is the on-hardware test pass. They are not *marked*
            > Pre-release on GitHub, because GitHub will not call a
            > prerelease "Latest" and the badge then sticks to whichever old
            > release happened to be unmarked — a stale version presented as
            > the newest is a worse signal than a missing badge.

            ```bash
            curl -LO https://github.com/jasoncheng7115/jt-pve-storage-dellemc/releases/latest/download/jt-pve-storage-dellemc_all.deb
            ```

            That file name never changes and always points at the newest
            release, which is what the second copy in every release is for.

            On **every** node of the cluster:

            ```bash
            apt install ./jt-pve-storage-dellemc_*_all.deb
            ```

            Use `apt install ./file.deb` rather than `dpkg -i`: dpkg does not
            install dependencies, and the missing binaries only surface much
            later as failures inside the plugin.

            After an upgrade, run `systemctl restart pvestatd` on every node.

            Verify the download against `SHA256SUMS`.
